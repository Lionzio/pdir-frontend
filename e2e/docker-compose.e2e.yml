# Banco e Redis descartáveis para os testes E2E (T-45). Portas próprias (55433/56380) para não colidir
# com o ambiente de desenvolvimento (5432/6379). Credenciais de teste, sem nenhum dado real.
name: pdir-e2e

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pdir
      POSTGRES_PASSWORD: pdir_e2e
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:55433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pdir']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.2-alpine
    ports:
      - '127.0.0.1:56380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

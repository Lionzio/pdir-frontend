name: Frontend CI

on:
  push:
    branches: [main, develop]
  # Todos os PRs, inclusive os empilhados (base diferente de main/develop)
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Angular 22 exige Node ^22.22.3 || ^24.15.0 (node_modules/@angular/core/package.json)
  NODE_VERSION: "22"

jobs:
  quality:
    name: Qualidade (ESLint, Prettier, tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Tipagem (tsc)
        run: npx tsc --noEmit -p tsconfig.json

  tests:
    name: Testes unitários (Karma, Chrome headless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes com cobertura
        run: npm test -- --code-coverage

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/
          if-no-files-found: ignore

  build:
    name: Build de produção
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

  audit:
    name: Dependências (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Bloqueia: vulnerabilidade alta ou crítica em dependência que vai para o navegador
      - name: Dependências de produção (bloqueante)
        run: npm audit --omit=dev --audit-level=high

      # Informativo: ferramentas de build/teste; avisos novos aparecem sem mudança no projeto
      - name: Todas as dependências (informativo)
        continue-on-error: true
        run: npm audit --audit-level=high

  secrets:
    name: Segredos no histórico (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner

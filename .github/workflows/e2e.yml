name: E2E

# T-45: fluxos críticos (FC1–FC10) com frontend e backend reais contra Postgres e Redis descartáveis.
# - PRs e pushes na develop: só o smoke (@smoke: login, mapa de quartos, nova reserva, logout)
# - Toda noite e sob demanda: a suíte completa
on:
  pull_request:
  push:
    branches: [develop]
  schedule:
    - cron: '0 6 * * *' # 03:00 em Brasília
  workflow_dispatch:
    inputs:
      suite:
        description: Suíte a rodar
        type: choice
        options: [completa, smoke]
        default: completa

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  gate:
    name: Acesso ao backend
    runs-on: ubuntu-latest
    outputs:
      has_backend: ${{ steps.check.outputs.has_backend }}
    steps:
      # O backend é um repositório privado: o GITHUB_TOKEN deste repositório não o lê.
      # Sem o secret PDIR_BACKEND_READ_TOKEN (leitura de conteúdo em Lionzio/pdir-backend), o E2E é pulado.
      - id: check
        env:
          BACKEND_TOKEN: ${{ secrets.PDIR_BACKEND_READ_TOKEN }}
        run: |
          if [ -n "$BACKEND_TOKEN" ]; then
            echo "has_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_backend=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=E2E pulado::Configure o secret PDIR_BACKEND_READ_TOKEN para rodar o E2E no CI (veja o README)."
          fi

  e2e:
    name: E2E (Playwright)
    needs: gate
    if: needs.gate.outputs.has_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUITE: ${{ (github.event_name == 'schedule' || inputs.suite == 'completa') && 'completa' || 'smoke' }}
      # Postgres e Redis vêm dos services abaixo, nas mesmas portas do docker-compose.e2e.yml
      E2E_SKIP_COMPOSE: '1'
      PDIR_BACKEND_DIR: ${{ github.workspace }}/backend
      PDIR_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
      NG_CLI_ANALYTICS: 'false'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pdir
          POSTGRES_PASSWORD: pdir_e2e
          POSTGRES_DB: postgres
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U pdir"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7.2-alpine
        ports:
          - 56380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout do backend (develop)
        uses: actions/checkout@v4
        with:
          repository: Lionzio/pdir-backend
          ref: develop
          token: ${{ secrets.PDIR_BACKEND_READ_TOKEN }}
          path: backend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Dependências do backend (uv.lock)
        working-directory: backend
        run: uv sync --frozen --python "$PYTHON_VERSION"

      - name: Dependências do frontend
        run: npm ci

      - name: Navegador do Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E (${{ env.SUITE }})
        run: |
          if [ "$SUITE" = "completa" ]; then
            npm run e2e
          else
            npm run e2e:smoke
          fi

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

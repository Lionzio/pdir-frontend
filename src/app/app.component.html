@if (auth.isAuthenticated()) {
  <button
    mat-mini-fab
    class="logout-button"
    id="btn-logout"
    aria-label="Sair"
    matTooltip="Sair"
    [disabled]="loggingOut()"
    (click)="logout()"
  >
    <mat-icon>logout</mat-icon>
  </button>
}
<router-outlet></router-outlet>
@if (auth.isAuthenticated()) {
  <app-chat-widget></app-chat-widget>
}
